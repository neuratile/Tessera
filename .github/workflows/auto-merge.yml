name: auto-merge

# Opt-in label enables native squash auto-merge after repository gates.
# It never bypasses required checks. Current rules require zero approvals and
# do not force an up-to-date branch; see BRANCH_PROTECTION.md.

on:
  pull_request:
    types: [opened, labeled, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --auto \
            --squash \
            --repo "${{ github.repository }}"
